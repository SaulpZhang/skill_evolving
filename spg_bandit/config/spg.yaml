embedding_model: Qwen/Qwen3-Embedding-0.6B
embedding_type: local
max_turns: 50

dataset:
  name: alfworld

evolve:
  split: train

evaluate:
  split: valid_unseen

selector: spg_bandit

skill_evolving:
  name: simple_agent

spg_bandit:
  warmup_ratio: 0.4
  window_size: 20
  K: 4
  alpha: 0.1
  d_f: 16
  tau: 0.1

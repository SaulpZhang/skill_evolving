embedding_model: Qwen/Qwen3-Embedding-0.6B
embedding_type: local
max_turns: 50

dataset:
  max_turns: 50
  name: webshop
  server_url: http://127.0.0.1:3000
  # Keep the ExpeL fixed-100 set held out for evaluation.  The evolving
  # pool uses the non-overlapping fixed_100..fixed_199 sessions.
  fixed_session_ranges:
    train:
      start: 100
      count: 100
  task_file: docs/ExpeL/data/webshop/webshop.fixed100.json
  request_timeout: 30

evolve:
  split: train
  n_tasks: 100

evaluate:
  split: test
  n_tasks: 100

selector: uniform

skill_evolving:
  name: expel
  mode: spg_online
  insight_strategy: incremental
  rollouts_per_task: 1
  evaluation_rollouts_per_task: 1
  temperature: 0.3
  max_tokens: 1024
  evaluation_temperature: 0.3
  evaluation_max_tokens: 1024
  enable_dynamic_update: true
  use_learned_memory_during_evolve: true
  max_reflection_depth: 3
  success_critique_num: 8
  top_k: 2
  max_fewshot_tokens: 1000
  max_num_rules: 20
  reflection_max_tokens: 4096
  insight_max_tokens: 4096
  reflection_temperature: 0.0

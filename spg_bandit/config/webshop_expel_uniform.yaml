embedding_model: Qwen/Qwen3-Embedding-0.6B
embedding_type: local
max_turns: 50

dataset:
  max_turns: 50
  name: webshop
  server_url: http://127.0.0.1:3000
  # Official WebShop i.i.d. partitions are train/dev/test =
  # 10,587/1,000/500. The server deterministically shuffles goals with seed
  # 233, so the following fixed-session ranges address the complete dev and
  # test partitions without overlap.
  fixed_session_ranges:
    dev:
      start: 10587
      count: 1000
    test:
      start: 11587
      count: 500
  request_timeout: 30

evolve:
  split: dev
  n_tasks: 1000

evaluate:
  split: test
  n_tasks: 500

selector: uniform

skill_evolving:
  name: expel
  mode: spg_online
  insight_strategy: incremental
  rollouts_per_task: 1
  evaluation_rollouts_per_task: 1
  temperature: 0.3
  max_tokens: 1024
  evaluation_temperature: 0.3
  evaluation_max_tokens: 1024
  enable_dynamic_update: true
  use_learned_memory_during_evolve: true
  max_reflection_depth: 3
  success_critique_num: 8
  top_k: 2
  max_fewshot_tokens: 1000
  max_num_rules: 20
  reflection_max_tokens: 4096
  insight_max_tokens: 4096
  reflection_temperature: 0.0

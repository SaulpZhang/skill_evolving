embedding_model: Qwen/Qwen3-Embedding-0.6B
embedding_type: local
max_turns: 50

dataset:
  name: alfworld

evolve:
  split: train

evaluate:
  split: valid_unseen

selector: spg_bandit

skill_evolving:
  name: skillrl
  # Upstream ALFWorld SkillRL runtime settings. Each selected task is expanded
  # into the same eight-rollout group used by the original training recipe.
  rollouts_per_task: 1
  history_length: 2
  temperature: 1.0
  max_tokens: 512
  evaluation_rollouts_per_task: 1
  evaluation_temperature: 0.4
  evaluation_max_tokens: 512
  top_k: 6
  retrieval_mode: template
  enable_dynamic_update: true
  # Recreate upstream train_batch_size=16 and test_freq/skill_update_freq=5.
  update_batch_size: 16
  skill_update_freq: 5
  flush_partial_batch: false
  update_threshold: 0.4
  max_new_skills: 3
  skill_bank_path: resource/skillrl/memory_data/alfworld/claude_style_skills.json

spg_bandit:
  warmup_ratio: 0.4
  window_size: 20
  K: 4
  alpha: 0.1
  d_f: 16
  tau: 0.1

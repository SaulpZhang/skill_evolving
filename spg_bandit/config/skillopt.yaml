embedding_model: Qwen/Qwen3-Embedding-0.6B
embedding_type: local
max_turns: 50

dataset:
  name: alfworld

evolve:
  split: train

# SkillOpt's validation gate uses a fixed pool that is not sent to the
# selector and is not part of the final evaluation pool.
skill_selection:
  split: valid_seen

evaluate:
  split: valid_unseen

selector: spg_bandit

skill_evolving:
  name: skillopt
  rollouts_per_task: 1
  batch_size: 8
  reflection_minibatch_size: 8
  edit_budget: 4
  merge_batch_size: 8
  reflection_workers: 1
  failure_only: false
  update_mode: patch
  selection_size: 24
  selection_rollouts: 1
  gate_metric: hard
  optimizer_backend: openai_compatible
  # Defaults fall back to REFLECTION_* and then LLM_* environment variables.
  # optimizer_base_url: http://localhost:8001/v1
  # optimizer_model: your-optimizer-model
  initial_skill_path: resource/skillopt/envs/alfworld/skills/initial.md

spg_bandit:
  warmup_ratio: 0.4
  window_size: 20
  K: 4
  alpha: 0.1
  d_f: 16
  tau: 0.1

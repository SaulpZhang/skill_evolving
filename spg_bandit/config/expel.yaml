embedding_model: Qwen/Qwen3-Embedding-0.6B
embedding_type: local
max_turns: 50

dataset:
  name: alfworld

evolve:
  split: valid_unseen

evaluate:
  split: valid_unseen

selector: spg_bandit

skill_evolving:
  name: expel
  # SPG chooses one trial at a time. A failed task gets ExpeL's New Plan
  # reflection, which is injected when the same task is selected again.
  # Use paper_faithful to run all reflection retries contiguously instead.
  mode: spg_online
  insight_strategy: incremental
  rollouts_per_task: 1
  evaluation_rollouts_per_task: 1
  temperature: 0.3
  max_tokens: 1024
  evaluation_temperature: 0.3
  evaluation_max_tokens: 1024
  enable_dynamic_update: true
  use_learned_memory_during_evolve: true
  max_reflection_depth: 3
  success_critique_num: 8
  top_k: 2
  max_fewshot_tokens: 1000
  max_num_rules: 20
  reflection_max_tokens: 4096
  insight_max_tokens: 4096
  reflection_temperature: 0.0

spg_bandit:
  warmup_ratio: 0.4
  window_size: 20
  # The supervised target is the selected rollout's MIRT profile transition.
  # "probe" remains available only as an explicit ablation.
  gain_measurement: mirt_transition
  K: 4
  alpha: 0.1
  d_f: 16
  tau: 0.1
  # Uses CUDA when torch can see it; otherwise cleanly falls back to CPU.
  device: auto
  # In auto mode, leave this much *currently free* GPU memory for vLLM and
  # other workloads; SPG warmup computation falls back to CPU below it.
  gpu_min_free_memory_mb: 2048
